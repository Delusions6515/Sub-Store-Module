name: ✨ 功能建议
description: 提出新功能或改进建议
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        感谢建议！描述清楚需求和使用场景，方便评估可行性。
  - type: checkboxes
    id: checklist
    attributes:
      label: 检查清单
      options:
        - label: 我已搜索过现有 Issues，没有重复
          required: true
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: 需求描述
      description: 你想要的功能/改进是什么
      placeholder: "例如: 希望能自定义 HTTP-META 的监听端口范围检查..."
    validations:
      required: true
  - type: textarea
    id: scenario
    attributes:
      label: 使用场景
      description: 在什么情况下会用到这个功能
      placeholder: "例如: 我的 9876 端口被 ddns-go 占用..."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望效果
      description: 实现后希望看到什么效果 (可选)
    validations:
      required: false
